# AWS note: the `aws` module stays enabled but only renders when AWS is
# actively in use (env vars like AWS_REGION/AWS_PROFILE, or a profile with
# creds). On 2026-08-03 the `[default]` sections in ~/.aws/config and
# ~/.aws/credentials were stripped so the module no longer triggers off
# static region/root-credential files at rest.
add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[git_status]
style = "bold yellow"
conflicted = "="
untracked = "?"
modified = "~"
staged = "+"
deleted = "-"
renamed = "»"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[directory]
truncation_length = 3
truncation_symbol = "…/"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘"

[cmd_duration]
min_time = 2000
format = "[$duration](bold yellow) "
